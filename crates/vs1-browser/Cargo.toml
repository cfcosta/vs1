[package]
name = "vs1-browser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Browser automation CLI using local vs1 decision models or hosted Jev"
repository = "https://github.com/cfcosta/vs1"

[dependencies]
vs1 = { workspace = true, optional = true }
candle-core = { version = "0.11.0", optional = true }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = "0.28"
url = "2"

[features]
default = []
local = ["dep:vs1", "dep:candle-core"]
cuda = ["local", "vs1/cuda", "candle-core/cuda"]
flash-attn = ["cuda", "vs1/flash-attn"]
metal = ["local", "vs1/metal", "candle-core/metal"]
mkl = ["local", "vs1/mkl", "candle-core/mkl"]
accelerate = ["local", "vs1/accelerate", "candle-core/accelerate"]
