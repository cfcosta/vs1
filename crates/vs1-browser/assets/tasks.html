<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local tasks</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          1rem system-ui,
          sans-serif;
        color: #343e38;
        background: #fcfcf8;
      }
      header {
        padding: 1rem 2rem;
        border-bottom: 1px solid #dce2d8;
      }
      main {
        max-width: 40rem;
        margin: auto;
        padding: 1.5rem 2rem;
      }
      h1 {
        margin: 0 0 1rem;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d6ddcf;
        border-radius: 0.3rem;
        background: white;
      }
      .fields,
      .field {
        display: grid;
        gap: 0.4rem;
      }
      .fields {
        gap: 0.8rem;
      }
      .checkboxes {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 1rem 0;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border: 1px solid #365b45;
        border-radius: 0.3rem;
        background: #365b45;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      dt {
        font-weight: 600;
        margin-top: 0.8rem;
      }
      dd {
        margin: 0.2rem 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      li {
        margin: 0.5rem 0;
      }
      .index-navigation {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-bottom: 1.5rem;
      }
      .long-catalog li {
        min-height: 9rem;
      }
    </style>
  </head>
  <body>
    <header>Local tasks</header>
    <main id="content"></main>
    <script>
      const root = document.getElementById("content");
      window.__taskState = {};

      function renderContactForm(variant) {
        document.title = "Support request · Local tasks";
        window.__taskState = { submission: null };
        root.innerHTML = `<h1>Support request</h1>
          <form id="contact-form">
            <div class="fields" id="contact-fields">
              <label class="field">Name <input name="name" required></label>
              <label class="field">Email <input name="email" type="email" required></label>
              <label class="field">Topic <select name="topic"><option>General</option><option>Billing</option><option>Technical</option><option>Account</option></select></label>
              <label class="field">Message <textarea name="message" rows="3" required></textarea></label>
            </div>
            <div class="checkboxes" id="contact-checkboxes">
              <label class="checkbox"><input name="privacy" type="checkbox" required> I accept the privacy terms</label>
            </div>
            <button type="submit">Send</button>
          </form>`;
        if (variant === "reordered") {
          const fields = document.getElementById("contact-fields");
          for (const field of [...fields.children].reverse()) fields.append(field);
        }
        if (variant === "newsletter") {
          document
            .getElementById("contact-checkboxes")
            .insertAdjacentHTML(
              "afterbegin",
              '<label class="checkbox"><input name="newsletter" type="checkbox"> Newsletter</label>',
            );
        }
        document.getElementById("contact-form").onsubmit = submitContactForm;
      }

      function submitContactForm(event) {
        event.preventDefault();
        const fields = event.currentTarget.elements;
        const submission = {
          name: fields.namedItem("name").value,
          email: fields.namedItem("email").value,
          topic: fields.namedItem("topic").value,
          message: fields.namedItem("message").value,
          hasAcceptedPrivacyTerms: fields.namedItem("privacy").checked,
        };
        window.__taskState.submission = submission;
        location.hash = "confirmation";
        document.title = "Support request sent · Local tasks";
        root.innerHTML = `<section id="contact-confirmation">
          <h1>Support request sent</h1>
          <dl>
            <dt>Name</dt><dd id="confirmation-name"></dd>
            <dt>Email</dt><dd id="confirmation-email"></dd>
            <dt>Topic</dt><dd id="confirmation-topic"></dd>
            <dt>Message</dt><dd id="confirmation-message"></dd>
            <dt>Privacy terms</dt><dd id="confirmation-consent"></dd>
          </dl>
        </section>`;
        for (const field of ["name", "email", "topic", "message"]) {
          document.getElementById(`confirmation-${field}`).textContent = submission[field];
        }
        document.getElementById("confirmation-consent").textContent =
          submission.hasAcceptedPrivacyTerms ? "Accepted" : "Not accepted";
      }

      function readSettings() {
        return {
          isWeeklyDigestEnabled: document.getElementById("weekly-digest").checked,
          areMarketingEmailsEnabled: document.getElementById("marketing-emails").checked,
          areSecurityAlertsEnabled: document.getElementById("security-alerts").checked,
          areProductUpdatesEnabled: document.getElementById("product-updates").checked,
        };
      }

      function renderSettings(variant) {
        document.title = "Notification settings · Local tasks";
        root.innerHTML = `<h1>Notification settings</h1>
          <form id="settings-form">
            <div class="fields" id="settings-fields">
              <label class="checkbox"><input id="weekly-digest" type="checkbox"> Weekly digest</label>
              <label class="checkbox"><input id="marketing-emails" type="checkbox" checked> Marketing emails</label>
              <label class="checkbox"><input id="security-alerts" type="checkbox" checked> Security alerts</label>
              <label class="checkbox"><input id="product-updates" type="checkbox"> Product updates</label>
            </div>
            <button type="submit">Save</button>
          </form>
          <section id="settings-confirmation" aria-live="polite"></section>`;
        if (variant === "reordered") {
          const fields = document.getElementById("settings-fields");
          for (const field of [...fields.children].reverse()) fields.append(field);
        }
        if (variant === "security-off") {
          document.getElementById("security-alerts").checked = false;
        }
        window.__taskState = {
          initialSettings: Object.freeze(readSettings()),
          savedSettings: null,
        };
        document.getElementById("settings-form").onsubmit = saveSettings;
      }

      function saveSettings(event) {
        event.preventDefault();
        const savedSettings = readSettings();
        window.__taskState.savedSettings = savedSettings;
        const areSecurityAlertsUnchanged =
          savedSettings.areSecurityAlertsEnabled ===
          window.__taskState.initialSettings.areSecurityAlertsEnabled;
        document.getElementById("settings-confirmation").innerHTML = `<h2>Settings saved</h2>
          <ul>
            <li>Weekly digest: ${savedSettings.isWeeklyDigestEnabled ? "On" : "Off"}</li>
            <li>Marketing emails: ${savedSettings.areMarketingEmailsEnabled ? "On" : "Off"}</li>
            <li>Security alerts ${areSecurityAlertsUnchanged ? "unchanged" : "changed"}: ${savedSettings.areSecurityAlertsEnabled ? "On" : "Off"}</li>
            <li>Product updates: ${savedSettings.areProductUpdatesEnabled ? "On" : "Off"}</li>
          </ul>`;
      }

      function renderProductList(variant) {
        document.title = "Products · Local tasks";
        const products = [
          { name: "River stories", category: "Books", isInStock: true },
          { name: "Garden notes", category: "Books", isInStock: true },
          { name: "Night atlas", category: "Books", isInStock: false },
          { name: "Blue jacket", category: "Clothing", isInStock: true },
        ];
        root.innerHTML = `<h1>Products</h1>
          <div class="fields" id="product-filters">
            <label class="field">Category <select id="category"><option>All</option><option selected>Books</option><option>Clothing</option></select></label>
            <label class="checkbox"><input id="in-stock-only" type="checkbox" checked> In stock only</label>
          </div>
          <h2>Results</h2>
          <ul id="product-results" aria-live="polite"></ul>`;
        if (variant === "reordered") {
          const filters = document.getElementById("product-filters");
          for (const filter of [...filters.children].reverse()) filters.append(filter);
        }
        function renderProductResults() {
          const category = document.getElementById("category").value;
          const isStockRequired = document.getElementById("in-stock-only").checked;
          document.getElementById("product-results").innerHTML = products
            .filter(
              (product) =>
                (category === "All" || product.category === category) &&
                (!isStockRequired || product.isInStock),
            )
            .map(
              (product) =>
                `<li>${product.name} · ${product.category} · ${product.isInStock ? "In stock" : "Out of stock"}</li>`,
            )
            .join("");
        }
        document.getElementById("category").onchange = renderProductResults;
        document.getElementById("in-stock-only").onchange = renderProductResults;
        renderProductResults();
      }

      function renderProductPage(variant) {
        document.title = "Blue jacket · Local tasks";
        window.__taskState = { cart: [], order: null };
        root.innerHTML = `<h1>Blue jacket</h1>
          <p>Size M is out of stock. Only sizes S and L are available.</p>
          <form id="product-form">
            <label class="field">Size <select id="size"><option>S</option><option value="M" selected>M — out of stock</option><option>L</option></select></label>
            <button id="add-to-cart" type="submit">Add to cart</button>
            <p id="stock-error" role="alert"></p>
          </form>
          <h2>Cart</h2>
          <p id="cart-status" aria-live="polite">Cart is empty.</p>
          <ul id="cart-items"></ul>`;
        const size = document.getElementById("size");
        if (variant === "disabled-option") {
          size.querySelector('[value="M"]').disabled = true;
          size.value = "S";
        }
        function updateAvailability() {
          document.getElementById("add-to-cart").disabled =
            size.value === "M" && variant !== "selectable-error";
          document.getElementById("stock-error").textContent = "";
        }
        size.onchange = updateAvailability;
        updateAvailability();
        document.getElementById("product-form").onsubmit = (event) => {
          event.preventDefault();
          if (size.value === "M") {
            document.getElementById("stock-error").textContent = "Size M is out of stock";
            return;
          }
          window.__taskState.cart.push({ product: "Blue jacket", size: size.value });
          const cartItem = document.createElement("li");
          cartItem.textContent = `Blue jacket · Size ${size.value}`;
          document.getElementById("cart-items").append(cartItem);
          document.getElementById("cart-status").textContent =
            `${window.__taskState.cart.length} item(s) in cart.`;
        };
      }

      function renderEncyclopedia(variant) {
        document.title = "Encyclopedia · Local tasks";
        window.__taskState = { openArticle: null };
        const articles = [
          {
            id: "incompleteness-theorems",
            title: "Gödel's incompleteness theorems",
            description: "Two theorems about the limits of formal arithmetic systems.",
          },
          {
            id: "completeness-theorem",
            title: "Gödel's completeness theorem",
            description:
              "A theorem connecting logical validity and provability in first-order logic.",
          },
          {
            id: "incompleteness-disambiguation",
            title: "Incompleteness (disambiguation)",
            description: "An index of topics that share the name incompleteness.",
          },
          {
            id: "incompleteness-book",
            title: "Gödel's incompleteness theorems (book)",
            description: "A book discussing the theorems and their history.",
          },
        ];
        if (variant === "reordered") articles.splice(0, 0, articles.splice(2, 1)[0]);
        if (variant === "not-first") articles.splice(2, 0, articles.shift());
        root.innerHTML = `<h1>Encyclopedia</h1>
          <form id="encyclopedia-search">
            <label class="field">Search encyclopedia <input id="search-query" type="search" required></label>
            <button type="submit">Search</button>
          </form>
          <section id="search-results" aria-live="polite"></section>`;
        document.getElementById("encyclopedia-search").onsubmit = searchArticles;

        function searchArticles(event) {
          event.preventDefault();
          const terms = document
            .getElementById("search-query")
            .value.trim()
            .toLowerCase()
            .split(/\s+/)
            .filter(Boolean);
          const results = articles.filter((article) =>
            terms.some((term) => article.title.toLowerCase().includes(term)),
          );
          location.hash = "search-results";
          document.getElementById("search-results").innerHTML = `<h2>Search results</h2>
            ${results.length ? `<ul>${results.map((article) => `<li><a href="#${article.id}" data-article="${article.id}">${article.title}</a></li>`).join("")}</ul>` : "<p>No articles found.</p>"}`;
          root.querySelectorAll("[data-article]").forEach((link) => {
            link.onclick = (event) => {
              event.preventDefault();
              openArticle(articles.find((article) => article.id === link.dataset.article));
            };
          });
        }

        function openArticle(article) {
          window.__taskState.openArticle = article.title;
          location.hash = article.id;
          document.title = `${article.title} · Local tasks`;
          root.innerHTML = `<article id="encyclopedia-article"><h1>${article.title}</h1><p>${article.description}</p></article>
            <button type="button" id="back-to-search">Back to search</button>`;
          document.getElementById("back-to-search").onclick = () => {
            location.hash = "";
            renderEncyclopedia(variant);
          };
          window.scrollTo(0, 0);
        }
      }

      function renderDocumentationIndex(variant) {
        document.title = "Documentation index · Local tasks";
        window.__taskState = { openPage: null };
        const sections = [
          {
            id: "getting-started",
            title: "Getting started",
            pages: [
              "Overview",
              "Quickstart",
              "Create an account",
              "Create a project",
              "First API request",
              "API conventions",
              "Sandbox setup",
              "Production checklist",
              "Environments",
              "Glossary",
            ],
          },
          {
            id: "authentication",
            title: "Authentication",
            pages: [
              "Authentication overview",
              "API keys",
              "OAuth applications",
              "Access tokens",
              "Refresh tokens",
              "Token expiration",
              "Permission scopes",
              "Service accounts",
              "Rotate credentials",
              "Revoke credentials",
            ],
          },
          {
            id: "rate-limits",
            title: "Rate limits",
            pages: [
              "Rate limit headers",
              "Rate limits and quotas",
              "Rate limit errors",
              "Quota usage reports",
              "Request budgets",
              "Burst limits",
              "Concurrent requests",
              "Retry after headers",
              "Backoff strategies",
              "Request a quota increase",
            ],
          },
          {
            id: "webhooks",
            title: "Webhooks",
            pages: [
              "Webhook overview",
              "Register an endpoint",
              "Event types",
              "Event payloads",
              "Verify signatures",
              "Delivery retries",
              "Delivery logs",
              "Test webhooks",
              "Replay events",
              "Webhook rate limits",
            ],
          },
          {
            id: "errors",
            title: "Errors",
            pages: [
              "Error response format",
              "HTTP status codes",
              "Validation errors",
              "Authentication errors",
              "Permission errors",
              "Resource not found",
              "Conflict errors",
              "Too many requests",
              "Server errors",
              "Troubleshooting requests",
            ],
          },
          {
            id: "sdks",
            title: "SDKs",
            pages: [
              "SDK overview",
              "JavaScript SDK",
              "Python SDK",
              "Rust SDK",
              "Go SDK",
              "Java SDK",
              "Ruby SDK",
              "SDK configuration",
              "SDK retry settings",
              "SDK migration guide",
            ],
          },
          {
            id: "resources",
            title: "Resources",
            pages: [
              "List resources",
              "Create a resource",
              "Update a resource",
              "Delete a resource",
              "Pagination",
              "Filtering",
              "Sorting",
              "Resource metadata",
              "Batch requests",
              "Idempotency keys",
            ],
          },
          {
            id: "operations",
            title: "Operations",
            pages: [
              "Audit logs",
              "Usage dashboard",
              "Request tracing",
              "Health checks",
              "Incident response",
              "Data exports",
              "Data retention",
              "Regional endpoints",
              "API versioning",
              "Changelog",
            ],
          },
        ];
        if (variant === "shuffled") sections.reverse();
        if (variant === "target-last") sections.push(sections.splice(2, 1)[0]);
        root.innerHTML = `<h1>Documentation index</h1>
          <nav class="index-navigation" aria-label="Documentation sections">
            ${sections.map((section) => `<a href="#${section.id}" aria-label="${section.title} section">${section.title}</a>`).join("")}
          </nav>
          ${sections.map((section) => `<section id="${section.id}"><h2>${section.title}</h2><ul>${section.pages.map((title) => `<li><a href="#doc-${title.toLowerCase().replaceAll(" ", "-")}" data-page="${title}">${title}</a></li>`).join("")}</ul></section>`).join("")}`;
        root.querySelectorAll("[data-page]").forEach((link) => {
          link.onclick = (event) => {
            event.preventDefault();
            openDocumentationPage(link.dataset.page, link.getAttribute("href"));
          };
        });

        function openDocumentationPage(title, hash) {
          window.__taskState.openPage = title;
          location.hash = hash;
          document.title = `${title} · Local tasks`;
          root.innerHTML = `<article id="documentation-page"><h1>${title}</h1><p>Documentation reference for ${title.toLowerCase()}.</p></article>
            <button type="button" id="back-to-index">Back to index</button>`;
          document.getElementById("back-to-index").onclick = () => {
            location.hash = "";
            renderDocumentationIndex(variant);
            window.scrollTo(0, 0);
          };
          window.scrollTo(0, 0);
        }
      }

      function renderProductCatalog(variant) {
        const products = [
          "Ceramic pencil cup",
          "Linen notebook",
          "Brass bookmark",
          "Cork desk mat",
          "Oak letter tray",
          "Glass paperweight",
          "Felt cable pouch",
          "Maple pen stand",
          "Cotton tote bag",
          "Bamboo monitor stand",
          "Stone coaster set",
          "Leather journal",
          "Steel ruler",
          "Birch bookends",
          "Wool chair cushion",
          "Copper clip holder",
          "Canvas tool roll",
          "Porcelain mug",
          "Cedar storage box",
          "Aluminum laptop stand",
          "Recycled paper planner",
          "Rubber doorstop",
          "Ash picture frame",
          "Silicone cable ties",
          "Woven storage basket",
          "Concrete planter",
          "Acacia serving tray",
          "Pocket sketchbook",
          "Travel pen case",
        ];
        const targetIndex = variant === "long-page" ? 9 : variant === "page-2" ? 10 : 20;
        products.splice(targetIndex, 0, "Walnut desk organizer");
        let pageNumber = 1;
        window.__taskState = { pageNumber, openProduct: null };
        renderCatalogPage();

        function renderCatalogPage() {
          window.__taskState.pageNumber = pageNumber;
          window.__taskState.openProduct = null;
          location.hash = `catalog-page-${pageNumber}`;
          document.title = "Product catalog · Local tasks";
          root.innerHTML = `<h1>Product catalog</h1>
            <p>Page ${pageNumber} of 3 · 10 products per page</p>
            <nav aria-label="Catalog pages">
              <button type="button" id="previous-page" ${pageNumber === 1 ? "disabled" : ""}>Previous</button>
              <button type="button" id="next-page" ${pageNumber === 3 ? "disabled" : ""}>Next</button>
            </nav>
            <ul id="catalog-products" class="${variant === "long-page" ? "long-catalog" : ""}">
              ${products
                .slice((pageNumber - 1) * 10, pageNumber * 10)
                .map(
                  (product) =>
                    `<li><a href="#product-${product.toLowerCase().replaceAll(" ", "-")}" data-product="${product}">${product}</a></li>`,
                )
                .join("")}
            </ul>`;
          document.getElementById("previous-page").onclick = () => {
            pageNumber -= 1;
            renderCatalogPage();
          };
          document.getElementById("next-page").onclick = () => {
            pageNumber += 1;
            renderCatalogPage();
          };
          root.querySelectorAll("[data-product]").forEach((link) => {
            link.onclick = (event) => {
              event.preventDefault();
              openCatalogProduct(link.dataset.product, link.getAttribute("href"));
            };
          });
          window.scrollTo(0, 0);
        }

        function openCatalogProduct(product, hash) {
          window.__taskState.openProduct = product;
          location.hash = hash;
          document.title = `${product} · Local tasks`;
          root.innerHTML = `<article id="catalog-product"><h1>${product}</h1><p>Home and office collection.</p></article>
            <button type="button" id="back-to-catalog">Back to catalog</button>`;
          document.getElementById("back-to-catalog").onclick = renderCatalogPage;
          window.scrollTo(0, 0);
        }
      }

      function renderBackpackProduct(variant) {
        const initialCart =
          variant === "existing-cart"
            ? [{ product: "Steel water bottle", size: "One size", quantity: 1 }]
            : [];
        window.__taskState = {
          initialCart: Object.freeze(initialCart.map((cartItem) => Object.freeze({ ...cartItem }))),
          cart: initialCart.map((cartItem) => ({ ...cartItem })),
          order: null,
        };
        location.hash = "backpack";
        document.title = "Canvas backpack · Local tasks";
        root.innerHTML = `<h1>Canvas backpack</h1>
          <p>A canvas backpack for everyday use.</p>
          <form id="backpack-form">
            <label class="field">Size <select id="backpack-size"><option>S</option><option>M</option><option>L</option></select></label>
            <button type="submit">Add to cart</button>
          </form>`;
        if (variant === "size-l") document.getElementById("backpack-size").value = "L";
        document.getElementById("backpack-form").onsubmit = addBackpackToCart;
        window.scrollTo(0, 0);

        function addBackpackToCart(event) {
          event.preventDefault();
          window.__taskState.cart.push({
            product: "Canvas backpack",
            size: document.getElementById("backpack-size").value,
            quantity: 1,
          });
          renderCart();
        }

        function renderCart() {
          location.hash = "cart";
          document.title = "Cart · Local tasks";
          root.innerHTML = `<h1>Cart</h1>
            <p>Use Update to save quantity changes before checkout.</p>
            <form id="cart-form">
              <ul id="backpack-cart">
                ${window.__taskState.cart.map((cartItem, index) => `<li><p>${cartItem.product} · Size ${cartItem.size} · Quantity ${cartItem.quantity}</p><label class="field">${cartItem.product} quantity <input id="cart-quantity-${index}" type="number" min="1" step="1" required value="${cartItem.quantity}"></label></li>`).join("")}
              </ul>
              <button type="submit">Update</button>
              <button type="button" id="checkout">Checkout</button>
            </form>`;
          document.getElementById("cart-form").onsubmit = updateCart;
          document.getElementById("checkout").onclick = openCheckout;
          window.scrollTo(0, 0);
        }

        function updateCart(event) {
          event.preventDefault();
          window.__taskState.cart.forEach((cartItem, index) => {
            cartItem.quantity = Number(document.getElementById(`cart-quantity-${index}`).value);
          });
          renderCart();
        }

        function openCheckout() {
          const order = window.__taskState.cart.map((cartItem) => ({ ...cartItem }));
          window.__taskState.order = order;
          location.hash = "checkout";
          document.title = "Checkout · Local tasks";
          root.innerHTML = `<section id="checkout-summary"><h1>Checkout</h1>
            <h2>Order summary</h2>
            <ul>${order.map((cartItem) => `<li>${cartItem.product} · Size ${cartItem.size} · Quantity ${cartItem.quantity}</li>`).join("")}</ul>
          </section>`;
          window.scrollTo(0, 0);
        }
      }

      const parameters = new URLSearchParams(location.search);
      const variant = parameters.get("variant") || "base";
      switch (parameters.get("case")) {
        case "contact-form":
          renderContactForm(variant);
          break;
        case "settings":
          renderSettings(variant);
          break;
        case "already-done":
          renderProductList(variant);
          break;
        case "out-of-stock":
          renderProductPage(variant);
          break;
        case "search-pick":
          renderEncyclopedia(variant);
          break;
        case "big-index":
          renderDocumentationIndex(variant);
          break;
        case "paginated":
          renderProductCatalog(variant);
          break;
        case "checkout":
          renderBackpackProduct(variant);
          break;
        default:
          root.innerHTML =
            "<h1>Unknown task</h1><p>Choose a task with the case query parameter.</p>";
      }
    </script>
  </body>
</html>
