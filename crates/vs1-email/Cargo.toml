[package]
name = "vs1-email"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Mailbox categorization using local laya decision models"
repository = "https://github.com/cfcosta/vs1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
vs1.workspace = true
candle-core = "0.11.0"
imap = { version = "2.4.1", default-features = false }
mailparse = "0.16"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
webpki-roots = "1"
clap = { version = "4", features = ["derive", "env"] }

[features]
default = []
cuda = ["vs1/cuda", "candle-core/cuda"]
flash-attn = ["cuda", "vs1/flash-attn"]
metal = ["vs1/metal", "candle-core/metal"]
mkl = ["vs1/mkl", "candle-core/mkl"]
accelerate = ["vs1/accelerate", "candle-core/accelerate"]
