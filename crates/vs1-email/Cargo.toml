[package]
name = "vs1-email"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Mailbox categorization using caller-selected laya or Jev decision models"
repository = "https://github.com/cfcosta/vs1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
regex = "1"
url = "2"
vs1.workspace = true
candle-core = "0.11.0"
mailparse = "0.16"
html2text = { version = "0.17", default-features = false }
clap = { version = "4", features = ["derive"] }

[features]
default = ["jev"]
jev = ["vs1/jev"]
cuda = ["vs1/cuda", "candle-core/cuda"]
metal = ["vs1/metal", "candle-core/metal"]
mkl = ["vs1/mkl", "candle-core/mkl"]
accelerate = ["vs1/accelerate", "candle-core/accelerate"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "backend_benchmark"
required-features = ["jev"]
