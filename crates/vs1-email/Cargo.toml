[package]
name = "vs1-email"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Mailbox categorization using local laya decision models"
repository = "https://github.com/cfcosta/vs1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
