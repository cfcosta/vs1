[package]
name = "vs1"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local laya and hosted Jev decision models with typed choice, score, and noul questions"
repository = "https://github.com/cfcosta/vs1"

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-flash-attn = { version = "0.11.0", optional = true }
candle-nn = "0.11.0"
hf-hub = { version = "0.5.0", default-features = false, features = [
  "ureq",
  "rustls-tls",
] }
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON objects in written order. The model reads
# a state as text and truncates it on the right, so key order is part
# of the input; laya's Python has it for free from dict semantics.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

reqwest = { version = "0.12", optional = true, default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }

[features]
default = ["jev"]
jev = ["dep:reqwest"]
# The full CUDA runtime: packed flash attention plus vs1's own kernels
# and CUTLASS GEMMs. Needs nvcc and NVIDIA's cutlass at build time.
cuda = [
  "candle-core/cuda",
  "candle-nn/cuda",
  "dep:candle-flash-attn",
  "dep:cudaforge",
]
metal = ["candle-core/metal", "candle-nn/metal"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hegeltest = "0.28"

[[bin]]
name = "vs1"
path = "src/bin/vs1.rs"

[[bench]]
name = "decide"
harness = false

[build-dependencies]
cudaforge = { version = "0.1.6", optional = true }
