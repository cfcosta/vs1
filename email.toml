# Classify message purpose, not sender. Decisions use at most five choices.
# Keep descriptions short: laya caps each option at 48 tokens.
# Fill in owner context before relying on owner-dependent categories.
[owner]
capture_venues = []
fixed_bills = []
clients = []
spouse = ""

[[rules]]
category = "capture"
what = "Periodic balances, statements or brokerage notes for owner.capture_venues."
not_for = "Single purchases or payments."

[[rules]]
category = "bills"
what = "Amounts due for owner.fixed_bills: invoices, boletos, overdue payment demands."
not_for = "Community notices or offers."

[[rules]]
category = "fiscal"
what = "Tax and accounting: DAS, GPS, DARF, IRPF, NFS-e, income reports, accountant requests."

[[rules]]
category = "income"
what = "Money arriving: incoming transfers, Pix recebido, payments or payouts received."
not_for = "Negotiating future work or rates."

[[rules]]
category = "receipts"
what = "Purchase receipts, order confirmations or paid subscription renewals."
not_for = "Periodic account statements."

[[rules]]
category = "careers"
what = "Hiring me: recruiters, applications, interviews, take-homes, offers, rejections."
not_for = "Delivering paid work."

[[rules]]
category = "clients"
what = "Client or prospect engagements: scope, deliverables, rates, contractor onboarding. See owner.clients."
not_for = "Employment or hiring processes."

[[rules]]
category = "papers"
what = "Executed permanent documents: signed contracts, NDAs, policies, certificates, diplomas."
not_for = "Unsigned drafts or signature requests."

[[rules]]
category = "equity"
what = "Ownership: option grants, vesting, shares, buybacks, cap tables, shareholder notices."

[[rules]]
category = "household"
what = "Coordination with owner.spouse: forwards, shared payments, family logistics, her security alerts."
not_for = "Obligations sent directly by companies."

[[rules]]
category = "identity"
what = "Civil bureaucracy: CPF/CNPJ, credit inquiries, customs, postal authorizations, consular or residence paperwork."

[[rules]]
category = "security"
what = "Account security: verification codes, login alerts, password resets, breaches, credential cleanup."
not_for = "Payment problems."

[[rules]]
category = "ops"
what = "Own infrastructure and developer accounts: domains, hosting, repositories, CI, quotas, API billing changes."
not_for = "Paid receipts for services."

[[rules]]
category = "health"
what = "Medical, fitness or pet care: appointments, results, plan changes, gym registrations, veterinary."
not_for = "Premiums due or pharmacy purchases."

[[rules]]
category = "travel"
what = "Travel plans: reservations, check-in, boarding, itinerary changes, loyalty balances."
not_for = "Ticket charges or paid receipts."

[[rules]]
category = "bulk"
what = "Broadcasts without obligations: newsletters, promotions, announcements, community notices, surveys."

[[rules]]
category = "other"
what = "None of the defined categories fits."
